[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdr"
version = "0.0.1"
description = "Private dense retrieval under quantization: retrieval-side prototype, sweeps and analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "sentence-transformers>=2.7",
    "beir>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
cohere = ["cohere>=5.0"]
# scale/ scripts use torch directly (installed with sentence-transformers); the readers need vllm.
readers = ["vllm"]

[project.scripts]
pdr = "pdr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
